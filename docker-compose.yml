# harness-poc — Session 2: identity-stub, gateway (router), orchestrator, the
# four mcp-* servers, audit. Session 3 adds the two Chainlit apps and the
# cloudflared tunnel profile.
#
# Every service builds from the repo root so the libs/ path dependencies
# resolve. ./data is a bind mount, not a named volume: scripts/seed.py
# runs on the host and writes the same files the services read, and the JWT
# keypair persists there across restarts.
#
# HEALTHCHECKS EXERCISE A REAL ENDPOINT, NOT A PORT OR A PROCESS. A listening
# socket proves only that something bound it; a worker wedged mid-request still
# holds the port and still passes a port check. So each probe fetches a URL the
# service actually has to serve, and urlopen raises on a connection failure, on
# a timeout, and on any status >= 400 — an uncaught exception exits nonzero, and
# that is the whole check.
#
# urllib rather than `curl -sf`: python:3.12-slim carries neither curl nor wget,
# and adding them would mean rebuilding every image for a liveness probe.
#
# 10s interval x 3 retries means a stopped worker reads unhealthy in about 30s.

services:
  identity-stub:
    build:
      context: .
      dockerfile: services/identity-stub/Dockerfile
    # Run as the host user so the JWT keypair and the SQLite files it writes into
    # the bind-mounted ./data are owned by you, not by root. tests/ reads
    # data/jwt_private.pem from the host to forge the negative-auth tokens.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports: ["127.0.0.1:8001:8001"]
    environment:
      JWT_ISSUER: http://identity-stub:8001
      JWT_AUDIENCE: ${JWT_AUDIENCE:-harness-poc}
      PERSONAS_PATH: /config/personas.yaml
      KEY_DIR: /data
    volumes:
      - ./services/identity-stub:/app/services/identity-stub
      - ./config:/config:ro
      - ./data:/data
    healthcheck:
      # The JWKS is what every other service needs from this one. A stub that
      # cannot serve its public keys is not usable, however alive it looks.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/jwks.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      HARNESS_SERVICE_NAME: gateway
      HARNESS_JWT_ISSUER: http://identity-stub:8001
      HARNESS_JWT_AUDIENCE: ${JWT_AUDIENCE:-harness-poc}
      HARNESS_JWKS_URL: http://identity-stub:8001/jwks.json
      HARNESS_AUDIT_URL: http://audit:8030/events
      ORCHESTRATOR_URL: http://orchestrator:8010/chat
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ROUTER_MODEL: ${ROUTER_MODEL:-deepseek-v4-flash}
      # The gateway builds only the router, so only the router's flag is set
      # here — AGENT_THINKING is not in this service's environment at all, and
      # therefore cannot reach the router by any route. See the note on
      # ROUTER_THINKING in libs/harness_models/factory.py.
      ROUTER_THINKING: ${ROUTER_THINKING:-false}
    volumes:
      - ./services/gateway:/app/services/gateway
      - ./libs:/app/libs
    depends_on:
      identity-stub:
        condition: service_healthy
      audit:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      # Liveness only: /healthz takes no token and calls nothing downstream, so
      # a dead orchestrator or identity-stub does not cascade into the gateway
      # reading unhealthy as well.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports: ["127.0.0.1:8010:8010"]
    environment:
      HARNESS_SERVICE_NAME: orchestrator
      HARNESS_JWT_ISSUER: http://identity-stub:8001
      HARNESS_JWT_AUDIENCE: ${JWT_AUDIENCE:-harness-poc}
      HARNESS_JWKS_URL: http://identity-stub:8001/jwks.json
      HARNESS_AUDIT_URL: http://audit:8030/events
      REGISTRY_PATH: /config/registry.yaml
      SKILLS_PATH: /config/skills.yaml
      # The skills kill switch (Session 12). Off, /chat validates nothing and
      # ignores nothing: the field is simply unused, no active_skills appears in
      # any audit row, and the request path is the one certified in Session 11.
      # Set on the two surfaces as well, so the toggle disappears with it.
      SKILLS_ENABLED: ${SKILLS_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-v4-pro}
      # SPEC §1's default, and Session 11's certified configuration. Session 11
      # ran the agent with reasoning on and reverted: the arithmetic gain was
      # real, but the beat it cost is demo moment 5b's amber row. SPEC §1
      # records the measurement. Set only here, on the one service that builds
      # the agent, so it cannot reach the router by any route.
      AGENT_THINKING: ${AGENT_THINKING:-false}
    volumes:
      - ./services/orchestrator:/app/services/orchestrator
      - ./libs:/app/libs
      - ./config:/config:ro
    depends_on:
      identity-stub:
        condition: service_healthy
      audit:
        condition: service_healthy
      mcp-colleague:
        condition: service_healthy
      mcp-canvas:
        condition: service_healthy
      mcp-kuali:
        condition: service_healthy
      mcp-labor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The four MCP servers are the enforcement layer (SPEC §4.4-4.7). They differ
  # only in tools, rules, database and port; mcp-colleague is the skeleton the
  # other three were stamped from, healthcheck block included.
  mcp-colleague:
    build:
      context: .
      dockerfile: services/mcp-colleague/Dockerfile
    ports: ["127.0.0.1:8021:8021"]
    environment:
      HARNESS_SERVICE_NAME: mcp-colleague
      HARNESS_JWT_ISSUER: http://identity-stub:8001
      HARNESS_JWT_AUDIENCE: ${JWT_AUDIENCE:-harness-poc}
      HARNESS_JWKS_URL: http://identity-stub:8001/jwks.json
      HARNESS_AUDIT_URL: http://audit:8030/events
      COLLEAGUE_DB_PATH: /data/colleague.db
    volumes:
      - ./services/mcp-colleague:/app/services/mcp-colleague
      - ./libs:/app/libs
      - ./data:/data:ro
    depends_on:
      identity-stub:
        condition: service_healthy
      audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8021/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-labor:
    build:
      context: .
      dockerfile: services/mcp-labor/Dockerfile
    ports: ["127.0.0.1:8022:8022"]
    environment:
      HARNESS_SERVICE_NAME: mcp-labor
      HARNESS_JWT_ISSUER: http://identity-stub:8001
      HARNESS_JWT_AUDIENCE: ${JWT_AUDIENCE:-harness-poc}
      HARNESS_JWKS_URL: http://identity-stub:8001/jwks.json
      HARNESS_AUDIT_URL: http://audit:8030/events
      LABOR_DB_PATH: /data/labor.db
    volumes:
      - ./services/mcp-labor:/app/services/mcp-labor
      - ./libs:/app/libs
      - ./data:/data:ro
    depends_on:
      identity-stub:
        condition: service_healthy
      audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8022/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-canvas:
    build:
      context: .
      dockerfile: services/mcp-canvas/Dockerfile
    ports: ["127.0.0.1:8023:8023"]
    environment:
      HARNESS_SERVICE_NAME: mcp-canvas
      HARNESS_JWT_ISSUER: http://identity-stub:8001
      HARNESS_JWT_AUDIENCE: ${JWT_AUDIENCE:-harness-poc}
      HARNESS_JWKS_URL: http://identity-stub:8001/jwks.json
      HARNESS_AUDIT_URL: http://audit:8030/events
      CANVAS_DB_PATH: /data/canvas.db
    volumes:
      - ./services/mcp-canvas:/app/services/mcp-canvas
      - ./libs:/app/libs
      - ./data:/data:ro
    depends_on:
      identity-stub:
        condition: service_healthy
      audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8023/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-kuali:
    build:
      context: .
      dockerfile: services/mcp-kuali/Dockerfile
    ports: ["127.0.0.1:8024:8024"]
    environment:
      HARNESS_SERVICE_NAME: mcp-kuali
      HARNESS_JWT_ISSUER: http://identity-stub:8001
      HARNESS_JWT_AUDIENCE: ${JWT_AUDIENCE:-harness-poc}
      HARNESS_JWKS_URL: http://identity-stub:8001/jwks.json
      HARNESS_AUDIT_URL: http://audit:8030/events
      KUALI_DB_PATH: /data/kuali.db
    volumes:
      - ./services/mcp-kuali:/app/services/mcp-kuali
      - ./libs:/app/libs
      - ./data:/data:ro
    depends_on:
      identity-stub:
        condition: service_healthy
      audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8024/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The two surfaces (SPEC §4.9). They differ in theme and header copy and in
  # nothing else — same image recipe, same environment, same gateway. Neither
  # holds a model key: the harness owns the agent loop, and that asymmetry is
  # the multiplexing claim in machine-readable form.
  #
  # Run as the host user, like identity-stub and audit: chainlit writes its
  # translations and upload directory into the bind-mounted app directory, and
  # root-owned files in your working tree are nobody's idea of a good time.
  ui-advisor:
    build:
      context: .
      dockerfile: apps/ui-advisor/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports: ["127.0.0.1:8080:8080"]
    environment:
      IDENTITY_URL: http://identity-stub:8001
      GATEWAY_URL: http://gateway:8000
      # Signs this app's own session cookie, and nothing else — it has no
      # bearing on the harness JWTs, which identity-stub signs with RS256.
      # The container-facing name is Chainlit's own and cannot change; the
      # .env-facing name is per app, so the two surfaces can hold different
      # secrets. The defaults are for localhost. Anything on a tunnel must set
      # real values in .env — a public URL plus a published cookie secret is a
      # forgeable login.
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET_ADVISOR:-harness-poc-demo-cookie-secret-advisor}
      # Whether this surface offers the plain-language switch at all. Same
      # variable as the orchestrator's, so one setting darkens the feature end
      # to end rather than leaving a toggle that nothing acts on.
      SKILLS_ENABLED: ${SKILLS_ENABLED:-true}
    volumes:
      - ./apps/ui-advisor:/app/apps/ui-advisor
    depends_on:
      identity-stub:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      # The login page. It is served without a token by design, so a 200 here
      # means the surface is up and can still say no to a bad password.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui-exec:
    build:
      context: .
      dockerfile: apps/ui-exec/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports: ["127.0.0.1:8081:8081"]
    environment:
      IDENTITY_URL: http://identity-stub:8001
      GATEWAY_URL: http://gateway:8000
      # Same as ui-advisor above, and deliberately a different variable and a
      # different default: two surfaces, two session-cookie secrets.
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET_EXEC:-harness-poc-demo-cookie-secret-exec}
      # Same as ui-advisor above: the toggle exists only where the feature does.
      SKILLS_ENABLED: ${SKILLS_ENABLED:-true}
    volumes:
      - ./apps/ui-exec:/app/apps/ui-exec
    depends_on:
      identity-stub:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional, and off unless asked for: `docker compose --profile tunnel up -d`.
  # Everything above works on plain localhost ports with the profile off, which
  # is how this is developed; the LXC deploy is `git pull` and the same command
  # with the profile on (SPEC §4.10).
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      # cloudflared reads TUNNEL_TOKEN from the environment itself, so the token
      # never appears in the command line and never shows up in `ps`.
      #
      # Defaulted rather than required (`:?`): compose interpolates every
      # service's variables even for profiles that are switched off, so a
      # required variable here would stop `docker compose up` on a laptop that
      # is never going to run a tunnel. Empty means cloudflared says so itself,
      # and only when it is actually asked to start.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./tunnel/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      ui-advisor:
        condition: service_healthy
      ui-exec:
        condition: service_healthy
      audit:
        condition: service_healthy

  audit:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports: ["127.0.0.1:8030:8030"]
    environment:
      AUDIT_DB_PATH: /data/audit.db
    volumes:
      - ./services/audit:/app/services/audit
      - ./data:/data
    healthcheck:
      # /events, not /healthz: reading the log back is what audit is for, and it
      # exercises the SQLite handle that a bare liveness route would not touch.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030/events?limit=1', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
