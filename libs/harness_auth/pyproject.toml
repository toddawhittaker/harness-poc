[project]
name = "harness-auth"
version = "0.1.0"
description = "Shared JWT verification and audit client for harness-poc"
requires-python = "==3.12.*"
dependencies = [
    "pyjwt[crypto]>=2.10",
    "cryptography>=44.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_auth"]
