[project]
name = "harness-models"
version = "0.1.0"
description = "The only place model clients and model config are built (SPEC §1)"
requires-python = "==3.12.*"
dependencies = [
    "pydantic-ai>=2.27",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_models"]
