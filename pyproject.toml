[project]
name = "harness-poc"
version = "0.1.0"
description = "POC of a university AI harness — test workspace and scripts"
# Pinned, not ">=3.12": SPEC §1 says Python 3.12 everywhere, and the services
# run 3.12 in their containers. Without the pin, `uv run pytest` on this host
# builds the test venv against whatever newer interpreter it finds.
requires-python = "==3.12.*"
dependencies = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44.0",
]

[tool.uv]
package = false

# One lockfile for the whole monorepo. Before this, each service carried its
# own uv.lock and they drifted: websockets was pinned 16.1.1 under gateway and
# orchestrator and 17.0.1 everywhere else. A workspace resolves every member
# against one graph, so a dependency bump is one review instead of ten.
[tool.uv.workspace]
members = ["libs/*", "services/*", "apps/*"]

[tool.ruff]
# 100 rather than 88: this codebase carries long explanatory docstrings on the
# MCP tools, and the longest single line in the repo is 619 characters — a tool
# docstring the model reads. E501 is deliberately NOT selected below for that
# reason; the line length here governs `ruff format` if it is ever run.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enforced in CI, and green on the whole tree as of Session 17 with no code
# changes: F is pyflakes — undefined names, unused imports, real defects — and
# E9 is syntax and IO errors. These catch bugs, not taste.
#
# NOT enforced yet, and each for a stated reason rather than an oversight:
#   I    import sorting — 14 findings, all auto-fixable, but the fix touches
#        files the Session 17 certification describes. Apply it after the
#        demonstration, in one mechanical commit, then add "I" here.
#   E501 line length — see above; the tool docstrings are deliberate.
#   BLE001, S608 and friends — the tree already carries 15 hand-written
#        `# noqa` comments with reasons, from an earlier pass. Turning the rules
#        on means auditing those 15 first.
# The rule is simply that this list only grows once the tree is green for it.
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The session2 tests were written ahead of the code they cover (the
# auth-reviewer's brief: every auth behavior gets its negative test before the
# passing code exists), and were deselected while that code did not exist.
# Session 2 has landed, so they now run by default along with everything else:
# `uv run pytest tests/ -q` must be green including them. The marker stays
# registered so the Session 2 surface can still be run on its own with
# `-m session2`.
markers = [
    "session2: covers services that arrive in Session 2 (orchestrator, mcp-*)",
    "session3: covers the two Chainlit surfaces (apps/ui-advisor, apps/ui-exec)",
    "disruptive: stops and restarts a container mid-suite; always restores it",
]
