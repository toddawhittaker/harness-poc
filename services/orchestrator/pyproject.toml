[project]
name = "orchestrator"
version = "0.1.0"
description = "The harness, always live (SPEC §4.3)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "harness-auth",
    "harness-models",
]

[tool.uv]
package = false

[tool.uv.sources]
harness-auth = { workspace = true }
harness-models = { workspace = true }
