<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Audit</title>
<style>
  :root {
    --bg: #12151c; --panel: #1a1f2a; --line: #2c3444;
    --text: #e6e9f0; --dim: #8b95a8;
    --ok: #4ade80; --refused: #fbbf24; --failed: #f87171;
    /* Neutral, on purpose. A bad argument is neither a success nor a refusal,
       and amber has to keep meaning "somebody was told no". Brighter than
       --dim so it reads as a value, not as metadata; 8.4:1 on --bg. */
    --error: #a8b0be;
    /* The single source of truth for the title band's height. The scroll
       container subtracts exactly this, so there is no gap and no overlap. */
    --title-h: 68px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 17px; line-height: 1.45;
    overflow: hidden;             /* the table container does the scrolling */
  }

  /* Static. Not sticky, not fixed — it simply sits above the scroll area. */
  header {
    display: flex; align-items: center; gap: 1.25rem;
    height: var(--title-h); padding: 0 1.25rem;
    background: var(--panel); border-bottom: 2px solid var(--line);
  }
  h1 { margin: 0; font-size: 1.4rem; letter-spacing: 0.02em; white-space: nowrap; }
  #count { color: var(--dim); font-size: 0.95rem; white-space: nowrap; }

  /* The chips are the legend now: each one carries its colour and filters to
     it, so the colour key and the control are the same object. The grey
     "error" chip also names a row class the old legend never explained. */
  .controls { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }
  .chip {
    font: inherit; font-size: 0.95rem; white-space: nowrap;
    padding: 0.3rem 0.8rem; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line);
  }
  .chip::before { content: "\25CF"; margin-right: 0.4rem; }
  .chip[data-filter="all"]::before { content: none; }
  .chip[data-filter="ok"]::before { color: var(--ok); }
  .chip[data-filter="refused"]::before { color: var(--refused); }
  .chip[data-filter="error"]::before { color: var(--error); }
  .chip[data-filter="failed"]::before { color: var(--failed); }
  .chip:hover { border-color: var(--dim); color: var(--text); }
  /* The active chip is filled, not merely tinted: from the back of a room a
     border colour is not a state. */
  .chip[aria-pressed="true"] {
    background: var(--text); color: var(--bg); border-color: var(--text);
    font-weight: 700;
  }
  select {
    font: inherit; font-size: 0.95rem; padding: 0.3rem 0.5rem;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  label.window { color: var(--dim); font-size: 0.95rem; white-space: nowrap; }

  @media (max-width: 1100px) { #count { display: none; } }
  @media (max-width: 820px) { h1 { display: none; } }

  /* The only scrolling element on the page. */
  .table-wrap {
    height: calc(100vh - var(--title-h));
    overflow-y: auto;
    overflow-x: auto;
  }

  /* separate, not collapse: with border-collapse a sticky th loses its
     borders and rows show through the seam. */
  table { width: 100%; border-collapse: separate; border-spacing: 0; }

  thead th {
    position: sticky; top: 0; z-index: 2;
    text-align: left; padding: 0.6rem 1rem;
    background: var(--panel);     /* fully opaque: rows pass behind, not through */
    color: var(--dim); font-weight: 600; text-transform: uppercase;
    font-size: 0.82rem; letter-spacing: 0.08em;
    border-bottom: 2px solid var(--line);
  }
  thead th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  thead th.sortable:hover { color: var(--text); }
  thead th.sorted { color: var(--text); }
  /* Reserved width, so turning the arrow on does not shift the heading. */
  .arrow { display: inline-block; width: 1.1em; text-align: center; }

  td { padding: 0.55rem 1rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr.ok td.event { color: var(--ok); }
  tbody tr.refused td.event { color: var(--refused); }
  tbody tr.failed td.event { color: var(--failed); }
  tbody tr.error td.event { color: var(--error); }
  tbody tr.refused { background: rgba(251, 191, 36, 0.07); }
  tbody tr.failed { background: rgba(248, 113, 113, 0.09); }
  td.event { font-weight: 700; white-space: nowrap; }
  td.ts, td.service, td.sub, td.roles { white-space: nowrap; color: var(--dim); }
  td.sub { color: var(--text); font-weight: 600; }
  td.detail { color: var(--dim); word-break: break-word; }
  td.empty { padding: 3rem 1.25rem; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Harness Audit</h1>
  <span id="count">connecting&hellip;</span>
  <div class="controls" id="chips">
    <button class="chip" data-filter="all" aria-pressed="true">All</button>
    <button class="chip" data-filter="ok" aria-pressed="false">ok</button>
    <button class="chip" data-filter="refused" aria-pressed="false">refused</button>
    <button class="chip" data-filter="error" aria-pressed="false">error</button>
    <button class="chip" data-filter="failed" aria-pressed="false">auth failed</button>
    <label class="window" for="window">window</label>
    <select id="window">
      <option value="50">last 50</option>
      <option value="100">last 100</option>
      <option value="200" selected>last 200</option>
      <option value="500">last 500</option>
    </select>
  </div>
</header>
<div class="table-wrap" id="scroller">
  <table>
    <thead>
      <tr id="head">
        <th class="sortable" data-key="ts">Time<span class="arrow"></span></th>
        <th class="sortable" data-key="service">Service<span class="arrow"></span></th>
        <th class="sortable" data-key="event">Event<span class="arrow"></span></th>
        <th class="sortable" data-key="sub">Who<span class="arrow"></span></th>
        <th class="sortable" data-key="roles">Roles<span class="arrow"></span></th>
        <th>Detail</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="6" class="empty">Waiting for events&hellip;</td></tr></tbody>
  </table>
</div>
<script>
  const FAILED = ["auth_failed"];
  const REFUSED = ["refused_at_gate", "router_parse_failed"];
  const DECISION_CLASS = { ok: "ok", refused: "refused", error: "error" };

  // Chip label per class, so the counter can say what it is showing in the
  // same words the pressed chip does.
  const FILTER_LABEL = { ok: "ok", refused: "refused", error: "error", failed: "auth failed" };

  const DEFAULT_SORT = { key: "ts", dir: -1, clicks: 0 };   // newest first

  const scroller = document.getElementById("scroller");
  const tbody = document.getElementById("rows");
  const counter = document.getElementById("count");
  const chips = document.getElementById("chips");
  const windowPicker = document.getElementById("window");
  const head = document.getElementById("head");

  let events = [];                        // the window as fetched, newest id first
  let filter = "all";
  let limit = Number(windowPicker.value);
  let sort = { ...DEFAULT_SORT };

  // The one classifier. The row colours and the chip filter read the same
  // function, so a chip can never select a set the colours disagree with.
  function rowClass(ev) {
    if (FAILED.includes(ev.event)) return "failed";
    if (REFUSED.includes(ev.event)) return "refused";
    // A decision we do not recognise reads neutral, never as success. Rows
    // with no decision at all — router_classified, answer_returned — are green.
    const decision = ev.detail && ev.detail.decision;
    if (decision) return DECISION_CLASS[decision] || "error";
    return "ok";
  }

  function clock(ts) {
    const t = new Date(ts);
    return isNaN(t) ? ts : t.toLocaleTimeString([], { hour12: false });
  }

  function describe(detail) {
    if (!detail || Object.keys(detail).length === 0) return "";
    return Object.entries(detail)
      .map(([k, v]) => k + "=" + (typeof v === "object" ? JSON.stringify(v) : v))
      .join("  ");
  }

  // Sorting reads the event, never the cell. "—" stands in for an absent `sub`
  // on screen and would sort among the letters; the field itself is empty and
  // sorts where an empty string belongs.
  function sortKey(ev, key) {
    if (key === "ts") {
      const t = Date.parse(ev.ts);
      return isNaN(t) ? 0 : t;
    }
    if (key === "roles") return (ev.roles || []).join(", ");
    return ev[key] || "";
  }

  function compare(a, b) {
    const x = sortKey(a, sort.key), y = sortKey(b, sort.key);
    if (x < y) return -sort.dir;
    if (x > y) return sort.dir;
    // Ties break on insertion order. Within a time sort it follows the sort's
    // own direction; within any other column the newest row of a group comes
    // first, which is what "group kim's rows together" is expected to look
    // like. Without this, same-second rows would shuffle on every poll.
    return sort.key === "ts" ? (a.id - b.id) * sort.dir : b.id - a.id;
  }

  // textContent, never innerHTML: audit detail is data, and this page goes on a
  // projector. Nothing in a detail field may become markup.
  const cell = (text, cls) => {
    const td = document.createElement("td");
    td.className = cls;
    td.textContent = text;
    return td;
  };

  function emptyRow(text) {
    const fragment = document.createDocumentFragment();
    const tr = document.createElement("tr");
    const td = cell(text, "empty");
    td.colSpan = 6;
    tr.appendChild(td);
    fragment.appendChild(tr);
    return fragment;
  }

  function buildRows(rows) {
    const fragment = document.createDocumentFragment();
    for (const ev of rows) {
      const tr = document.createElement("tr");
      tr.className = rowClass(ev);
      tr.appendChild(cell(clock(ev.ts), "ts"));
      tr.appendChild(cell(ev.service, "service"));
      tr.appendChild(cell(ev.event, "event"));
      tr.appendChild(cell(ev.sub || "—", "sub"));
      tr.appendChild(cell((ev.roles || []).join(", ") || "—", "roles"));
      tr.appendChild(cell(describe(ev.detail), "detail"));
      fragment.appendChild(tr);
    }
    return fragment;
  }

  function markSortedColumn() {
    for (const th of head.querySelectorAll("th.sortable")) {
      const active = th.dataset.key === sort.key;
      th.classList.toggle("sorted", active);
      th.querySelector(".arrow").textContent = active ? (sort.dir === 1 ? "▲" : "▼") : "";
    }
  }

  // Filter first, then sort — the filter narrows the fetched window, and the
  // sort orders what is left. Neither fetches anything.
  function render(keepScroll) {
    const shown = filter === "all"
      ? events.slice()
      : events.filter(ev => rowClass(ev) === filter);
    shown.sort(compare);

    const { scrollTop, scrollLeft } = scroller;
    if (shown.length === 0) {
      tbody.replaceChildren(emptyRow(
        filter === "all"
          ? "No events yet."
          : `No ${FILTER_LABEL[filter]} events in the last ${limit}.`));
    } else {
      tbody.replaceChildren(buildRows(shown));
    }
    // A poll keeps the reader where they were; changing a control deliberately
    // takes them back to the top, because what they are looking at has changed.
    scroller.scrollTop = keepScroll ? scrollTop : 0;
    scroller.scrollLeft = keepScroll ? scrollLeft : 0;

    markSortedColumn();
    // Honest about what it did: the filter narrows the window it was given, it
    // does not go and fetch 500 refusals.
    counter.textContent = filter === "all"
      ? `${shown.length} events · last ${limit}`
      : `${shown.length} ${FILTER_LABEL[filter]} · last ${limit}`;
  }

  async function poll() {
    try {
      const res = await fetch(`/events?limit=${limit}`);
      events = await res.json();
    } catch (err) {
      counter.textContent = "audit unreachable";
      return;
    }
    render(true);
  }

  chips.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    filter = chip.dataset.filter;
    for (const other of chips.querySelectorAll(".chip")) {
      other.setAttribute("aria-pressed", String(other === chip));
    }
    render(false);
  });

  windowPicker.addEventListener("change", () => {
    limit = Number(windowPicker.value);
    render(false);        // relabel immediately, then refill from the server
    poll();
  });

  head.addEventListener("click", (e) => {
    const th = e.target.closest("th.sortable");
    if (!th) return;
    const key = th.dataset.key;
    if (sort.key !== key || sort.clicks === 0) {
      sort = { key, dir: 1, clicks: 1 };       // first click: ascending
    } else if (sort.clicks === 1) {
      sort = { key, dir: -1, clicks: 2 };      // second click: reversed
    } else {
      sort = { ...DEFAULT_SORT };              // third click: back to newest first
    }
    render(false);
  });

  // Before the first response lands there is nothing to render, but the Time
  // column is already the sort, so it says so rather than appearing unsorted.
  markSortedColumn();
  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
