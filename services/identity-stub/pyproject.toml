[project]
name = "identity-stub"
version = "0.1.0"
description = "Fake identity provider — real RS256 tokens (SPEC §4.1)"
requires-python = "==3.12.*"
# Deliberately does NOT depend on harness_auth: this service mints tokens,
# it never verifies them.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
